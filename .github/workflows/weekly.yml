name: weekly-ndvi

on:
  schedule:
    # 5〜9月は毎日、それ以外は毎週月曜。どちらも 4:23 JST（UTC 前日 19:23。0分ちょうどは混み合って遅れやすい）
    # 新しい画像がない日はすぐ終わる。月曜は全セルを調べ直す
    - cron: '23 19 * 5-9 *'
    - cron: '23 19 * 1-4,10-12 0'
  workflow_dispatch:
    inputs:
      rebuild_cells:
        description: '区画グリッドを作り直す（筆ポリゴン更新時）'
        type: boolean
        default: false
      max_minutes:
        description: 'NDVI計算に使う時間の上限（分）'
        default: '300'
      full:
        description: '新しい画像の有無に関係なく全セルを調べる'
        type: boolean
        default: false

concurrency:
  group: ndvi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write          # 定期実行が止まらないようにする（下の最後のステップ）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
        continue-on-error: true
      - name: 前回データを復元
        run: |
          if [ -d published/data ]; then mkdir -p site && rm -rf site/data && cp -r published/data site/data; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: 区画グリッドを作成（初回 or 指定時）
        if: ${{ inputs.rebuild_cells == true || hashFiles('site/data/index.json') == '' }}
        run: python pipeline/build_cells.py

      - name: NDVI を更新
        env:
          EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
          EE_PRIVATE_KEY: ${{ secrets.EE_PRIVATE_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
        run: python pipeline/update_ndvi.py --max-minutes ${{ inputs.max_minutes || '300' }} --workers 4 ${{ inputs.full && '--full' || '' }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: 'update ndvi data'

      # GitHub は公開リポジトリで60日間動きがないと定期実行を止めるので、毎回「有効」にし直しておく
      - name: 定期実行を有効のままにする
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable weekly.yml --repo "${{ github.repository }}" || true
