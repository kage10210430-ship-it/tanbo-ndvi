# 公開されている資料（市町の鳥獣被害防止計画の PDF など）を取ってきて、文字にしてログに出す。
# 作業用のコンテナから役所のサイトに直接つながらないときに使う。
#   手で: Actions → fetch-docs → Run workflow（URL を空白で区切って入れる）
#   自動: .github/fetch-urls.txt（1行に1つ）を書きかえて push したとき
name: fetch-docs
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 取ってくる URL（空白で区切る）
        required: true
  push:
    paths: [".github/fetch-urls.txt"]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 道具
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-jpn >/dev/null
          pip install -q openpyxl xlrd pillow pyshp
      - name: 取ってくる
        env:
          URLS: ${{ inputs.urls }}
        run: |
          [ -n "$URLS" ] || URLS=$(grep -v '^#' .github/fetch-urls.txt)
          mkdir -p out && cd out
          i=0
          for u in $URLS; do
            i=$((i+1)); f=$(printf '%02d' $i)
            echo "=====DOC $f $u"
            if ! curl -sSL --max-time 120 -A 'Mozilla/5.0' -o $f.bin -w "HTTP %{http_code} %{content_type} %{size_download}B\n" "$u"; then echo "失敗"; continue; fi
            if head -c 8 $f.bin | od -An -tx1 | grep -q '89 50 4e 47'; then   # PNG（地図タイルなど）は大きさと色だけ出す
              python3 -c "import sys;from PIL import Image;im=Image.open(sys.argv[1]);print('PNG',im.size,im.mode,sorted(im.convert('RGBA').getcolors(1<<20) or [],reverse=True)[:8])" $f.bin 2>&1 || true; continue; fi
            if head -c 5 $f.bin | grep -q '%PDF'; then
              pdftotext -layout $f.bin $f.txt || true
              if [ "$(tr -d '[:space:][:digit:]' < $f.txt | wc -c)" -lt 300 ]; then   # 画像だけの PDF は文字を読み取る（はじめの8ページ）
                echo "（画像の PDF なので OCR）"; pdftoppm -r 300 -l 8 -gray $f.bin $f.p
                { for g in $f.p*.pgm; do tesseract $g - -l jpn --psm 6 2>/dev/null; done
                  echo "（はじめの2ページを別の読み方でもう一度）"
                  for g in $(ls $f.p*.pgm | head -n 2); do tesseract $g - -l jpn --psm 4 2>/dev/null; done; } > $f.txt
              fi
              sed 's/[[:space:]]*$//' $f.txt | grep -v '^$' | head -n 1500
            elif case "$u" in *.zip) true;; *) false;; esac; then   # ZIP（地図データ）は中身の一覧と、shapefile の項目・値の例を出す
              python3 - "$f.bin" <<'PY'
          import sys, zipfile, io, collections, shapefile
          z = zipfile.ZipFile(sys.argv[1])
          for i in z.infolist(): print("FILE", i.filename, i.file_size)
          for n in z.namelist():
              if n.lower().endswith(".prj"): print("PRJ", n, z.read(n)[:300])
              if not n.lower().endswith(".shp"): continue
              b = n[:-4]; get = lambda e: next((io.BytesIO(z.read(x)) for x in z.namelist() if x.lower() == (b + e).lower()), None)
              for enc in ("cp932", "utf-8"):
                  try:
                      r = shapefile.Reader(shp=get(".shp"), dbf=get(".dbf"), shx=get(".shx"), encoding=enc)
                      print("SHP", n, enc, r.shapeTypeName, len(r), [round(v, 4) for v in r.bbox], [f[0] for f in r.fields[1:]])
                      recs = r.records()
                      for k, f in enumerate(r.fields[1:]):
                          c = collections.Counter(str(x[k]) for x in recs)
                          print("  FIELD", f[0], f[1], len(c), c.most_common(40))
                      break
                  except Exception as e:
                      print("ERR", n, enc, e)
          PY
            elif head -c 4 $f.bin | grep -q 'PK' || head -c 4 $f.bin | od -An -tx1 | grep -q 'd0 cf 11 e0'; then   # Excel（xlsx / xls）は表を文字にする
              python3 - "$f.bin" <<'PY'
          import sys, shutil
          p = sys.argv[1]; n = 0
          if open(p, "rb").read(2) == b"PK":
              import openpyxl
              shutil.copy(p, p + ".xlsx")
              wb = openpyxl.load_workbook(p + ".xlsx", read_only=True, data_only=True)
              sheets = [(ws.title, ws.iter_rows(values_only=True)) for ws in wb.worksheets]
          else:
              import xlrd
              wb = xlrd.open_workbook(p)
              sheets = [(sh.name, (sh.row_values(i) for i in range(sh.nrows))) for sh in wb.sheets()]
          for name, rows in sheets:
              print("## SHEET", name)
              for r in rows:
                  cells = ["" if v is None else str(v).strip() for v in r]
                  if any(cells):
                      print("\t".join(cells)); n += 1
                  if n > 3000: break
          PY
            else python3 - "$f.bin" "$u" <<'PY'
          import sys, re, html
          from urllib.parse import urljoin
          b = open(sys.argv[1], "rb").read()
          m = re.search(rb'charset=["\']?([\w-]+)', b[:3000]); enc = (m.group(1).decode() if m else "utf-8")
          t = b.decode(enc, "replace")
          for h, a in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', t, re.S | re.I):
              a = re.sub(r"<[^>]+>|\s+", " ", a).strip()
              if re.search(r"\.(pdf|xlsx?|csv)$|file-download|statInfId", h, re.I) or re.search("鳥獣|獣害|被害|計画|福井|市町村別|作付|収穫量", a):
                  print("LINK", urljoin(sys.argv[2], html.unescape(h)), a[:80])
          t = re.sub(r"(?is)<(script|style|head)[^>]*>.*?</\1>", " ", t)
          t = html.unescape(re.sub(r"<[^>]+>", "\n", t))
          lines = [re.sub(r"\s+", " ", x).strip() for x in t.split("\n")]
          print("\n".join([x for x in lines if x][:400]))
          PY
            fi
          done
