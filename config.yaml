# ============================================================
#  田んぼNDVI 事前計算パイプライン 設定
# ============================================================

# 区画データ（筆ポリゴン）の入手先。農林水産省「筆ポリゴンデータ(2026年)」の
# 福井県 分割1・分割2。自動でダウンロード・連結・展開します（手でダウンロード不要）
parcel_sources:
  - https://www.maff.go.jp/j/tokei/census/shuraku_data/2025/mb/MB0001_2026_2025_18.zip.001
  - https://www.maff.go.jp/j/tokei/census/shuraku_data/2025/mb/MB0001_2026_2025_18.zip.002

# 対象範囲（西, 南, 東, 北）。まずは原種センター周辺だけ。
# 県全体にするときは  bbox: null  に書き換える
bbox: null

# 田だけを対象にする
only_paddy: true

# 区画IDと種別の列名（空欄なら自動で探す）
id_field:
land_type_field:

# 配信用グリッド（この単位でファイルを分ける）。約2.2km×1.85km
cell_deg_lon: 0.025
cell_deg_lat: 0.01667

# 畦畔を避けて内側に縮める距離(m)
edge_m: 5

# NDVI計算
history_months: 24        # 初回にさかのぼる期間
max_scene_cloud:          # シーン雲量(%)がこれ以上の画像は使わない。空欄なら画像全体の雲量では捨てない
cloud_score_min: 0.6      # Cloud Score+ の晴れ度（0〜1）。これ以上の画素だけ使う。上げるほど厳しい
landsat: true             # Landsat 8/9（NASA HLS, 30m）も使う（観測を増やす）
landsat_min_pixels: 2     # Landsat の30m画素がこれ未満しか入らない小さい区画には使わない
pixel_maps: true          # 圃場内マップ（10m画素ごとの NDVI）を作る
pixel_window: ["05-15", "09-25"]   # 圃場内マップを作る期間（今年と昨年）

# 出力先
site_dir: ./site
