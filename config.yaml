# ============================================================
#  田んぼNDVI 事前計算パイプライン 設定
# ============================================================

# 区画データ（筆ポリゴン）の入手先。農林水産省「筆ポリゴンデータ(2026年)」の
# 福井県 分割1・分割2。自動でダウンロード・連結・展開します（手でダウンロード不要）
parcel_sources:
  - https://www.maff.go.jp/j/tokei/census/shuraku_data/2025/mb/MB0001_2026_2025_18.zip.001
  - https://www.maff.go.jp/j/tokei/census/shuraku_data/2025/mb/MB0001_2026_2025_18.zip.002

# 対象範囲（西, 南, 東, 北）。まずは原種センター周辺だけ。
# 県全体にするときは  bbox: null  に書き換える
bbox: null

# 田だけを対象にする
only_paddy: true

# 区画IDと種別の列名（空欄なら自動で探す）
id_field:
land_type_field:

# 配信用グリッド（この単位でファイルを分ける）。約2.2km×1.85km
cell_deg_lon: 0.025
cell_deg_lat: 0.01667

# 畦畔を避けて内側に縮める距離(m)
edge_m: 5

# NDVI計算
history_months: 24        # 初回にさかのぼる期間
max_scene_cloud:          # シーン雲量(%)がこれ以上の画像は使わない。空欄なら画像全体の雲量では捨てない
cloud_score_min: 0.6      # Cloud Score+ の晴れ度（0〜1）。これ以上の画素だけ使う。上げるほど厳しい
landsat: true             # Landsat 8/9（NASA HLS, 30m）も使う（観測を増やす）
landsat_min_pixels: 2     # Landsat の30m画素がこれ未満しか入らない小さい区画には使わない
radar: true               # Sentinel-1 レーダー（雲を通す）も使う。表示では晴れた日の NDVI から換算した推定値
radar_window: ["04-15", "08-10"]   # レーダーを計算する時期（各年）。4月下旬の代掻き・水張りから。表示は 5/10〜7/31
pixel_maps: true          # 圃場内マップ（10m画素ごとの NDVI）を作る
pixel_window: ["05-10", "09-30"]   # 圃場内マップを作る期間（今年と昨年）
trend_maps: true          # 生育傾向マップ（稲の年だけを重ねた、田の中の毎年の強い・弱い）を作る
trend_from: 2022          # 何年からさかのぼって重ねるか（2022〜今年の5か年）
trend_windows: {e: ["06-01", "07-05"], l: ["07-20", "08-20"]}   # 「6月ごろ」「8月ごろ」の期間（月-日）
trend_center: [136.29, 36.05]   # この場所（経度, 緯度）に近いセルから先に作る
wet_maps: true            # 機械のハマりやすさの手がかり（土壌図・標高・衛星の乾き）を作る（pipeline/wet.py）
wet_sat: true             # そのうち衛星の乾き（GEE）も作る。false なら土壌図と標高だけ
wet_state_dir: ./state/wet   # 乾きの時期ごとの合計（<セル>.npz）。公開サイト（容量1GB）には入れず、Actions では wet-state ブランチに保存する
soil_pref: 18              # 土壌図の予備（土地分類基本調査 20万分の1）の都道府県コード（福井 18）
wet_seasons: 10           # 最初に取る乾きの時期（春 3/1〜4/25・秋 10/10〜12/10）の数。新しい方から。そのあとは新しい時期だけ足す

# 出力先
site_dir: ./site
